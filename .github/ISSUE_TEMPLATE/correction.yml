name: Correction
description: Report a factual error in a published article
title: '[Correction] '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep Oxelan Signal accurate. Please include a primary
        source where possible. Do not include confidential information or exploit
        details in a public issue. For security vulnerabilities, email
        hello@oxelan.com instead.
  - type: input
    id: article
    attributes:
      label: Article URL
      description: The full URL of the post.
      placeholder: https://blog.oxelan.com/security/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the passage and explain the error.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Supporting source
      description: A primary source (vendor advisory, CVE, release notes, standard, code) and what it shows.
    validations:
      required: false
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: The wording or fact that should replace it.
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Only if you want a reply and it is safe to share publicly.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have not included confidential information, personal data or exploit details.
          required: true
