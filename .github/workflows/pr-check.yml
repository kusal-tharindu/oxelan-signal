name: Pull request checks

# Pushing to stg runs nothing. Pipelines run for main only:
#   - deploy.yml on every push to main (full `npm run ci` gate, then deploy)
#   - this workflow on pull requests into main, or manually from the Actions tab
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache generated OG images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/og
          key: og-${{ runner.os }}-${{ hashFiles('src/content/**', 'src/lib/og.ts', 'src/lib/og-key.ts', 'package-lock.json') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Formatting
        run: npm run format:check

      - name: Type check, tests, content, images, build, links, artifact
        run: npm run ci

  e2e:
    runs-on: ubuntu-latest
    # Separate job so a browser-only failure does not mask the fast checks.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache generated OG images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/og
          key: og-${{ runner.os }}-${{ hashFiles('src/content/**', 'src/lib/og.ts', 'src/lib/og-key.ts', 'package-lock.json') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests (mobile 390x844, touch)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
