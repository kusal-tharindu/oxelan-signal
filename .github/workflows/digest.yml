name: Weekly digest draft

on:
  schedule:
    # Monday morning: build a draft for the week that just ended.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege by job. The `build` job runs `npm ci` (and therefore the install
# scripts of every dependency) with only `contents: read` and NO persisted credentials,
# so a compromised dependency cannot push to the repo. The separate `pr` job holds the
# write token but runs no npm at all — it only downloads the reviewed artifact, commits
# it, and opens the pull request. See review BLOG-M9.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      week: ${{ steps.draft.outputs.week }}
      created: ${{ steps.draft.outputs.created }}
    steps:
      - name: Checkout stg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stg
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache generated OG images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/og
          key: og-${{ runner.os }}-${{ hashFiles('src/content/**', 'src/lib/og.ts', 'src/lib/og-key.ts', 'package-lock.json') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create digest draft
        id: draft
        run: |
          set -euo pipefail
          WEEK="$(date -u -d '7 days ago' +%G-w%V)"
          FILE="src/content/digest/${WEEK}.md"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          if [ -f "$FILE" ]; then
            echo "Digest ${WEEK} already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run digest
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify the draft
        if: steps.draft.outputs.created == 'true'
        run: npm run ci

      - name: Upload the draft artifact
        if: steps.draft.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ steps.draft.outputs.week }}
          path: src/content/digest/${{ steps.draft.outputs.week }}.md
          retention-days: 1

  pr:
    needs: build
    if: needs.build.outputs.created == 'true'
    runs-on: ubuntu-latest
    # This job holds the write token but never runs npm; it only moves the artifact.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout stg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stg

      - name: Download the draft artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digest-${{ needs.build.outputs.week }}
          path: src/content/digest/

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ needs.build.outputs.week }}
        run: |
          set -euo pipefail
          BRANCH="digest/${WEEK}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "src/content/digest/${WEEK}.md"
          git commit -m "content: add ${WEEK} digest draft"
          git push -u origin "$BRANCH"
          gh pr create \
            --base stg \
            --head "$BRANCH" \
            --title "content: ${WEEK} digest" \
            --body "Automated draft for the week of ${WEEK}. Review the links, add anything worth watching, and remove \`draft: true\` before merging. The digest was validated by the build job. Merges land on \`stg\`; production deploys from \`main\`."
