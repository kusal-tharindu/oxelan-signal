name: Weekly digest draft

on:
  schedule:
    # Monday morning: build a draft for the week that just ended.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege by job. The `build` job runs `npm ci` (and therefore the install
# scripts of every dependency) with only `contents: read` and NO persisted credentials,
# so a compromised dependency cannot push to the repo. The separate `pr` job holds the
# write token but runs no npm at all — it only downloads the reviewed artifact, commits
# it, and opens the pull request. See review BLOG-M9.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      week: ${{ steps.draft.outputs.week }}
      created: ${{ steps.draft.outputs.created }}
    steps:
      # The digest covers published posts, so it is built from main and its PR targets
      # main (stg belongs to the content engine).
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache generated OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/og
          key: og-${{ runner.os }}-${{ hashFiles('src/content/**', 'src/lib/og.ts', 'src/lib/og-key.ts', 'package-lock.json') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create digest draft
        id: draft
        run: |
          set -euo pipefail
          WEEK="$(date -u -d '7 days ago' +%G-w%V)"
          FILE="src/content/digest/${WEEK}.md"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          if [ -f "$FILE" ]; then
            echo "Digest ${WEEK} already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run digest
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify the draft
        if: steps.draft.outputs.created == 'true'
        run: npm run ci

      - name: Upload the draft artifact
        if: steps.draft.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ steps.draft.outputs.week }}
          path: src/content/digest/${{ steps.draft.outputs.week }}.md
          retention-days: 1

  pr:
    needs: build
    if: needs.build.outputs.created == 'true'
    runs-on: ubuntu-latest
    # This job holds the write token but never runs npm; it only moves the artifact.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download the draft artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ needs.build.outputs.week }}
          path: src/content/digest/

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEK: ${{ needs.build.outputs.week }}
        run: |
          set -euo pipefail
          BRANCH="digest/${WEEK}"
          TITLE="content: ${WEEK} digest"
          BODY="Automated draft for the week of ${WEEK}. Review the links, add anything worth watching, and remove \`draft: true\` before merging. The build job already ran the full \`npm run ci\` on this draft (pull requests opened by GitHub Actions do not start the PR check workflow). Merging into \`main\` deploys the site."
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # A branch without a PR is left by an earlier run whose PR step failed:
            # open the PR instead of stopping silently.
            if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
              echo "Branch ${BRANCH} already has an open pull request; nothing to do."
              exit 0
            fi
            echo "Branch ${BRANCH} exists without an open pull request; opening it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add "src/content/digest/${WEEK}.md"
            git commit -m "content: add ${WEEK} digest draft"
            git push -u origin "$BRANCH"
          fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
