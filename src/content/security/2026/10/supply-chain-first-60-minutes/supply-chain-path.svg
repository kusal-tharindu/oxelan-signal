<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Supply-chain attack path</title>
  <desc id="desc">A malicious package is published to a registry, installed by a CI runner, steals a token from the runner environment, and uses it to reach a registry and production.</desc>
  <rect width="900" height="380" rx="10" fill="#0F1521"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9AA7BD">
    <text x="34" y="36" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#E0A619">ATTACK PATH</text>
    <text x="34" y="56" font-size="12">One publish becomes one credential, then one production path.</text>
  </g>

  <g>
    <rect x="34" y="92" width="170" height="92" rx="6" fill="#182235" stroke="#354258"/>
    <text x="52" y="118" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#FF7A6E">01 · PUBLISH</text>
    <text x="52" y="143" font-size="14" fill="#E8EDF6">Malicious version</text>
    <text x="52" y="162" font-size="12" fill="#9AA7BD">Typosquat or stolen</text>
    <text x="52" y="178" font-size="12" fill="#9AA7BD">maintainer token</text>
  </g>

  <g stroke="#354258" stroke-width="1.5">
    <path d="M204 138 H252" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="252" y="92" width="170" height="92" rx="6" fill="#182235" stroke="#354258"/>
    <text x="270" y="118" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#FF9F45">02 · INSTALL</text>
    <text x="270" y="143" font-size="14" fill="#E8EDF6">CI runner</text>
    <text x="270" y="162" font-size="12" fill="#9AA7BD">postinstall runs</text>
    <text x="270" y="178" font-size="12" fill="#9AA7BD">with job identity</text>
  </g>

  <g stroke="#354258" stroke-width="1.5">
    <path d="M422 138 H470" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="470" y="92" width="170" height="92" rx="6" fill="#182235" stroke="#354258"/>
    <text x="488" y="118" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#F4CF5B">03 · PIVOT</text>
    <text x="488" y="143" font-size="14" fill="#E8EDF6">Token theft</text>
    <text x="488" y="162" font-size="12" fill="#9AA7BD">registry · cloud</text>
    <text x="488" y="178" font-size="12" fill="#9AA7BD">repository · OIDC</text>
  </g>

  <g stroke="#354258" stroke-width="1.5">
    <path d="M640 138 H688" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="688" y="92" width="178" height="92" rx="6" fill="#2a1418" stroke="#FF7A6E" stroke-opacity="0.6"/>
    <text x="706" y="118" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#FF7A6E">04 · IMPACT</text>
    <text x="706" y="143" font-size="14" fill="#E8EDF6">Production</text>
    <text x="706" y="162" font-size="12" fill="#9AA7BD">new release, data</text>
    <text x="706" y="178" font-size="12" fill="#9AA7BD">access, persistence</text>
  </g>

  <rect x="34" y="220" width="832" height="54" rx="6" fill="#0A0E17" stroke="#263041"/>
  <text x="52" y="243" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#9AA7BD">WHAT THE FIRST HOUR BUYS</text>
  <text x="52" y="262" font-size="12" fill="#E8EDF6">Time. Freeze deploys → snapshot state → scope installs → revoke identity → rebuild clean.</text>

  <rect x="34" y="292" width="832" height="54" rx="6" fill="#0A0E17" stroke="#263041"/>
  <text x="52" y="315" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#9AA7BD">WHAT IT DOES NOT BUY</text>
  <text x="52" y="334" font-size="12" fill="#E8EDF6">Proof. If you cannot show a credential was unused, rotate it. Evidence beats optimism.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#354258"/>
    </marker>
  </defs>
</svg>
